<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BENIQR - Pedidos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      color: #b33;
    }
    .category {
      background: #eee;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .products {
      display: none;
      margin-top: 10px;
    }
    .product {
      margin-bottom: 5px;
    }
    button {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h1 id="local">BENIQR</h1>
  <p style="text-align:center;">Elegí tu pedido</p>

  <div class="category" onclick="toggle('miga')">🥪 Sándwiches de miga</div>
  <div id="miga" class="products">
    <div class="product"><input type="checkbox" value="Jamón y queso"> Jamón y queso</div>
    <div class="product"><input type="checkbox" value="Jamón y huevo"> Jamón y huevo</div>
    <div class="product"><input type="checkbox" value="Jamón y tomate"> Jamón y tomate</div>
    <div class="product"><input type="checkbox" value="Queso y salame"> Queso y salame</div>
    <div class="product"><input type="checkbox" value="Queso y aceitunas"> Queso y aceitunas</div>
    <div class="product"><input type="checkbox" value="Queso y choclo"> Queso y choclo</div>
  </div>

  <div class="category" onclick="toggle('congelados')">❄️ Comida congelada</div>
  <div id="congelados" class="products">
    <div class="product"><input type="checkbox" value="Bondiola desmenuzada"> Bondiola desmenuzada</div>
    <div class="product"><input type="checkbox" value="Empanadas"> Empanadas</div>
    <div class="product"><input type="checkbox" value="Pizzas"> Pizzas</div>
  </div>

  <button onclick="enviarPedido()">📲 Enviar pedido</button>
</div>

<script>
  const comercios = {
    patagonia: "Fiambrería La Patagonia",
    kiosco: "gusty",
    kiosco: " el angel "
  };

  const path = window.location.pathname.replace("/", "");
  const nombre = comercios[path] || "Comercio";

  document.getElementById("local").innerText = "BENIQR - " + nombre;

  function toggle(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
  }

  function enviarPedido() {
    const checks = document.querySelectorAll("input[type=checkbox]:checked");
    if (checks.length === 0) {
      alert("Seleccioná al menos un producto");
      return;
    }

    let pedido = `Pedido de: ${nombre}%0A%0A`;
    checks.forEach(c => pedido += `- ${c.value}%0A`);

    const telefono = "5491170373536"; // TU WHATSAPP
    window.open(`https://wa.me/${telefono}?text=${pedido}`, "_blank");
  }
</script>

</body>
</html>
