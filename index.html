<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BENIQR – Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}
.card {
  background: white;
  max-width: 420px;
  margin: auto;
  padding: 20px;
  border-radius: 12px;
}
h1 {
  color: #c1121f;
  text-align: center;
}
.product {
  margin: 10px 0;
}
button {
  background: #25D366;
  color: white;
  border: none;
  padding: 15px;
  font-size: 16px;
  border-radius: 8px;
  width: 100%;
  cursor: pointer;
}
select, input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}
</style>
</head>

<body>
<div class="card">
  <h1 id="local">BENIQR</h1>

  <p>Elegí tus productos:</p>

  <div class="product">
    <input type="checkbox" value="Sándwich de miga - Jamón y queso"> Sándwich Jamón y Queso
  </div>

  <div class="product">
    <input type="checkbox" value="Picada clásica"> Picada clásica
  </div>

  <div class="product">
    <input type="checkbox" value="Tarta de jamón y queso"> Tarta Jamón y Queso
  </div>

  <p>¿Retiro o delivery?</p>
  <select id="entrega">
    <option>Retiro por el local</option>
    <option>Delivery</option>
  </select>

  <button onclick="pedir()">📲 Enviar pedido por WhatsApp</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const local = params.get("local") || "el angel";
document.getElementById("local").innerText = local;

function pedir() {
  const telefono = "5491170373536";
  const productos = [...document.querySelectorAll('input[type="checkbox"]:checked')]
    .map(p => "• " + p.value)
    .join("\n");

  const entrega = document.getElementById("entrega").value;

  const mensaje = `Hola! Quiero hacer un pedido desde BENIQR.
Comercio: ${local}

Pedido:
${productos}

Forma de entrega: ${entrega}`;

  const link = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
  window.open(link, "_blank");
}
</script>
</body>
</html>
