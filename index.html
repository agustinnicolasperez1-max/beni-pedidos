<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BENIQR - Pedidos</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}

.card{
  max-width:500px;
  margin:40px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#8b5c5c;
}

.category{
  background:#eee;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
  font-weight:bold;
}

.products{
  display:none;
  padding:10px;
   position: relative;
  z-index: 10;
}

.subcategory{
  margin-top:10px;
  font-weight:bold;
  color:#555;
}

.product{
  margin-left:10px;
}

button{
  width:100%;
  margin-top:20px;
  padding:12px;
  background:#25D366;
  border:none;
  color:white;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}
</style>

<script>
function toggle(id){
  const el = document.getElementById(id);
  el.style.display = el.style.display === "none" ? "block" : "none";
}

function enviarPedido(){
  let productos = document.querySelectorAll('input:checked');
  let texto = "Hola! Quiero pedir:\n";

  productos.forEach(p=>{
    texto += "- " + p.value + "\n";
  });

  let numero = "5491170373536"; // TU NÚMERO DE WHATSAPP
  let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
  window.open(url, "_blank");
}
</script>
</head>

<body>

<div class="card">
  <h1>BENIQR</h1>
  <p style="text-align:center;">Elegí tu pedido</p>

  <!-- SANDWICH DE MIGA -->
  <div class="category" onclick="toggle('sandwich')">🥪 Sándwiches de miga</div>
  <div id="sandwich" class="products">

    <div class="subcategory">Clásicos</div>
    <div class="product"><input type="checkbox" value="Jamón y queso"> Jamón y queso</div>
    <div class="product"><input type="checkbox" value="Jamón y huevo"> Jamón y huevo</div>
    <div class="product"><input type="checkbox" value="Jamón y tomate"> Jamón y tomate</div>
    <div class="product"><input type="checkbox" value="Queso y salame"> Queso y salame</div>
    <div class="product"><input type="checkbox" value="Queso y aceitunas"> Queso y aceitunas</div>
    <div class="product"><input type="checkbox" value="Queso y choclo"> Queso y choclo</div>

    <div class="subcategory">Especiales</div>
    <div class="product"><input type="checkbox" value="Jamón crudo y queso"> Jamón crudo y queso</div>
    <div class="product"><input type="checkbox" value="Jamón crudo, rúcula y parmesano"> Jamón crudo, rúcula y parmesano</div>
  </div>

  <!-- CONGELADOS -->
  <div class="category" onclick="toggle('congelados')">❄️ Comida congelada</div>
  <div id="congelados" class="products">

    <div class="product"><input type="checkbox" value="Bondiola desmenuzada con pan"> Bondiola desmenuzada con pan</div>
    <div class="product"><input type="checkbox" value="Empanadas"> Empanadas</div>
    <div class="product"><input type="checkbox" value="Pizzas"> Pizzas</div>

  </div>

  <button onclick="enviarPedido()">Enviar pedido por WhatsApp</button>
</div>

</body>
</html>
