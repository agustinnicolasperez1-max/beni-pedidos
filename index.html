<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BENIQR – Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}

.card {
  background: #ffffff;
  max-width: 480px;
  margin: auto;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
  color: #c1121f;
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 20px;
}

.section {
  margin-bottom: 20px;
}

.section h3 {
  margin-bottom: 10px;
  color: #333;
}

.product {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.product span {
  font-size: 15px;
}

input[type="number"], input[type="text"], select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #25D366;
  color: white;
  border: none;
  padding: 15px;
  font-size: 17px;
  border-radius: 10px;
  width: 100%;
  cursor: pointer;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="local">BENIQR</h1>
  <div class="subtitle">Hacé tu pedido fácil por WhatsApp</div>

  <div class="section">
    <h3>🥪 Sándwiches</h3>
    <div class="product">
      <span>Jamón y queso</span>
      <input type="number" min="0" placeholder="Cantidad" data-product="Sándwich Jamón y Queso">
    </div>
    <div class="product">
      <span>Pollo</span>
      <input type="number" min="0" placeholder="Cantidad" data-product="Sándwich de Pollo">
    </div>
  </div>

  <div class="section">
    <h3>🧀 Picadas</h3>
    <div class="product">
      <span>Picada clásica</span>
      <input type="number" min="0" placeholder="Cantidad" data-product="Picada clásica">
    </div>
    <div class="product">
      <span>Picada premium</span>
      <input type="number" min="0" placeholder="Cantidad" data-product="Picada premium">
    </div>
  </div>

  <div class="section">
    <h3>🚚 Forma de entrega</h3>
    <select id="entrega">
      <option>Retiro por el local</option>
      <option>Delivery</option>
    </select>
  </div>

  <div class="section">
    <h3>📝 Datos del cliente</h3>
    <input type="text" id="nombre" placeholder="Tu nombre">
    <input type="text" id="direccion" placeholder="Dirección (si es delivery)">
  </div>

  <button onclick="enviarPedido()">📲 Enviar pedido</button>

  <div class="footer">
    Sistema BENIQR
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const local = params.get("local") || "Comercio";
document.getElementById("local").innerText = local;

function enviarPedido() {
  const telefono = "549XXXXXXXXXX"; // TU WHATSAPP

  let pedido = "";
  document.querySelectorAll('input[type="number"]').forEach(input => {
    if (input.value && input.value > 0) {
      pedido += `• ${input.dataset.product} x${input.value}\n`;
    }
  });

  if (pedido === "") {
    alert("Seleccioná al menos un producto.");
    return;
  }

  const entrega = document.getElementById("entrega").value;
  const nombre = document.getElementById("nombre").value || "No indicado";
  const direccion = document.getElementById("direccion").value || "No indicada";

  const mensaje = `Hola! Quiero hacer un pedido desde BENIQR.

Comercio: ${local}

Cliente: ${nombre}

Pedido:
${pedido}

Entrega: ${entrega}
Dirección: ${direccion}`;

  const link = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
  window.open(link, "_blank");
}
</script>

</body>
</html>
