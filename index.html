<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BENIQR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #7a3e2f;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      background: #7a3e2f;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #5c2e22;
    }
    .product {
      background: #eee;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      cursor: pointer;
    }
    #pedido {
      margin-top: 10px;
      background: #fff8e1;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>BENIQR</h1>
  <p>Elegí tu pedido:</p>

  <button onclick="mostrar('miga')">🥪 Sándwiches de miga</button>
  <button onclick="mostrar('congelados')">❄️ Congelados</button>

  <div id="productos"></div>

  <div id="pedido">
    <strong>Tu pedido:</strong>
    <div id="lista"></div>
  </div>

  <button onclick="enviarPedido()">📲 Enviar pedido por WhatsApp</button>
</div>

<script>
  let pedido = [];

  const productos = {
    miga: [
      "Jamón y queso",
      "Jamón y huevo",
      "Jamón y tomate",
      "Queso y salame",
      "Queso y aceitunas",
      "Jamón crudo y queso",
      "Jamón crudo, rúcula y parmesano",
      "Queso y choclo"
    ],
    congelados: [
      "Bondiola desmenuzada",
      "Empanadas",
      "Pizzas"
    ]
  };

  function mostrar(categoria) {
    const contenedor = document.getElementById("productos");
    contenedor.innerHTML = "";

    productos[categoria].forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerText = p;
      div.onclick = () => agregar(p);
      contenedor.appendChild(div);
    });
  }

  function agregar(producto) {
    pedido.push(producto);
    document.getElementById("lista").innerHTML = pedido.join("<br>");
  }

  function enviarPedido() {
    if (pedido.length === 0) {
      alert("Elegí al menos un producto");
      return;
    }

    const texto = "Hola! Quiero pedir:\n\n" + pedido.join("\n");
    const telefono = "5491170373536";

    const url = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(texto);
    window.open(url, "_blank");
  }
</script>

</body>
</html>
